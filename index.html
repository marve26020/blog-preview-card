<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Climate+Crisis:YEAR@1979&family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main>
      <section class="container" style="border: 2px solid brown">
        <div class="wall-image">
          <img
            class="blog-image"
            src="./images/illustration-article.svg"
            alt="A beautiful image that explains the beauty of the profile blog"
          />
        </div>
        <div class="content">
          <span class="learn-text">Learning</span>
          <p class="blog-date">Published 21 Dec 2023</p>
          <h1>HTML & CSS foundations</h1>
          <p class="blog-note">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </div>
        <div class="author">
          <img
            class="author-image"
            src="./images/image-avatar.webp"
            alt="Picture showing the authors face"
          />
          <p>Greg Hooper</p>
        </div>
      </section>
    </main>
  </body>
</html>
